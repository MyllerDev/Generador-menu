<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Generador de Menús - Restaurante</title>

    <link rel="stylesheet" href="styles.css" />

    <!-- Librerías para generar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>

  <body>
    <div class="app">
      <!-- =========================
         PANEL DE CONFIGURACIÓN
    ========================== -->

      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">🍽️</div>

          <div>
            <h1>Generador</h1>
            <span>de menús</span>
          </div>
        </div>

        <div class="sidebar-content">
          <!-- DATOS RESTAURANTE -->
          <section class="form-section">
            <div class="section-title">
              <span>01</span>
              <h2>Datos del restaurante</h2>
            </div>

            <div class="field">
              <label>Nombre</label>
              <input
                type="text"
                id="restaurantName"
                value="EXQUISIT RESTAURANT"
                placeholder="Nombre del restaurante"
              />
            </div>

            <div class="field">
              <label>Teléfono 1</label>
              <input
                type="text"
                id="phone1"
                value="3001900104"
                placeholder="Teléfono"
              />
            </div>

            <div class="field">
              <label>Teléfono 2</label>
              <input
                type="text"
                id="phone2"
                value="3142513029"
                placeholder="Teléfono"
              />
            </div>

            <div class="field">
              <label>Dirección</label>
              <input
                type="text"
                id="address"
                value="AV. CARACAS #34-17 LOCAL 2"
                placeholder="Dirección"
              />
            </div>

            <div class="field">
              <label>Texto destacado</label>
              <input
                type="text"
                id="highlight"
                value="MENÚ"
                placeholder="MENÚ"
              />
            </div>
          </section>

          <!-- ENTRADAS -->
          <section class="form-section">
            <div class="section-title">
              <span>02</span>
              <h2>Entradas</h2>
            </div>

            <div id="entradasContainer" class="dynamic-list"></div>

            <button type="button" class="add-btn" onclick="addItem('entradas')">
              + Agregar entrada
            </button>
          </section>

          <!-- PRINCIPIOS -->
          <section class="form-section">
            <div class="section-title">
              <span>03</span>
              <h2>Principios</h2>
            </div>

            <div id="principiosContainer" class="dynamic-list"></div>

            <button
              type="button"
              class="add-btn"
              onclick="addItem('principios')"
            >
              + Agregar principio
            </button>
          </section>

          <!-- PROTEÍNAS -->
          <section class="form-section">
            <div class="section-title">
              <span>04</span>
              <h2>Proteínas</h2>
            </div>

            <div id="proteinasContainer" class="dynamic-list"></div>

            <button
              type="button"
              class="add-btn"
              onclick="addItem('proteinas')"
            >
              + Agregar proteína
            </button>
          </section>

          <!-- MENU 2 -->
          <section class="form-section">
            <div class="section-title">
              <span>05</span>
              <h2>Menú #2</h2>
            </div>

            <div id="menu2Container" class="dynamic-list"></div>

            <button type="button" class="add-btn" onclick="addItem('menu2')">
              + Agregar plato
            </button>
          </section>

          <!-- PRECIOS -->
          <section class="form-section">
            <div class="section-title">
              <span>06</span>
              <h2>Precios</h2>
            </div>

            <div class="price-grid">
              <div class="field">
                <label>Menú #1 salón</label>

                <div class="price-input">
                  <span>$</span>

                  <input type="number" id="priceSalon1" value="14000" />
                </div>
              </div>

              <div class="field">
                <label>Menú #1 domicilio</label>

                <div class="price-input">
                  <span>$</span>

                  <input type="number" id="priceDelivery1" value="15000" />
                </div>
              </div>

              <div class="field">
                <label>Menú #2 salón</label>

                <div class="price-input">
                  <span>$</span>

                  <input type="number" id="priceSalon2" value="22000" />
                </div>
              </div>

              <div class="field">
                <label>Menú #2 domicilio</label>

                <div class="price-input">
                  <span>$</span>

                  <input type="number" id="priceDelivery2" value="23000" />
                </div>
              </div>
            </div>
          </section>

          <!-- BOTONES -->

          <div class="actions">
            <button class="clear-btn" onclick="clearForm()">Limpiar</button>

            <button class="png-btn" onclick="generatePNG()">
              <span>↓</span>
              Descargar PNG
            </button>

            <button class="pdf-btn" onclick="generatePDF()">
              <span>↓</span>
              Generar PDF
            </button>
          </div>
        </div>
      </aside>

      <!-- =========================
         ÁREA DE PREVISUALIZACIÓN
    ========================== -->

      <main class="preview-area">
        <div class="preview-header">
          <div>
            <span class="eyebrow">VISTA PREVIA</span>

            <h2>Hoja de impresión</h2>

            <p>6 menús por hoja A4</p>
          </div>

          <div class="status">
            <span class="status-dot"></span>
            Actualización automática
          </div>
        </div>

        <!-- HOJA A4 -->

        <div class="paper-wrapper">
          <div id="menuSheet" class="menu-sheet">
            <!-- MENÚ 1 -->
            <div class="menu-card"></div>

            <!-- MENÚ 2 -->
            <div class="menu-card"></div>

            <!-- MENÚ 3 -->
            <div class="menu-card"></div>

            <!-- MENÚ 4 -->
            <div class="menu-card"></div>

            <!-- MENÚ 5 -->
            <div class="menu-card"></div>

            <!-- MENÚ 6 -->
            <div class="menu-card"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- =========================
     TEMPLATE DEL MENÚ
========================== -->

    <template id="menuTemplate">
      <div class="menu-inner">
        <div class="menu-top">
          <img
            src="logo.png"
            alt="Logo del restaurante"
            class="restaurant-logo"
          />

          <div class="restaurant-name">EXQUISIT RESTAURANT</div>

          <div class="menu-badge">MENÚ</div>
        </div>

        <div class="contact-info">
          <div class="service">SERVICIO A DOMICILIO</div>

          <div class="phones">3001900104 - 3142513029</div>

          <div class="address">AV. CARACAS #34-17 LOCAL 2</div>
        </div>

        <div class="menus-grid">
          <!-- MENÚ 1 -->

          <div class="menu-one">
            <div class="menu-heading">MENÚ #1</div>

            <div class="menu-section">
              <div class="section-heading">ENTRADAS</div>

              <div class="items entradas-preview"></div>
            </div>

            <div class="menu-section">
              <div class="section-heading">PRINCIPIOS</div>

              <div class="items principios-preview"></div>
            </div>

            <div class="menu-section">
              <div class="section-heading">PROTEÍNAS</div>

              <div class="items proteinas-preview"></div>
            </div>

            <div class="prices">
              <div>
                <span>En el salón</span>

                <strong class="price-salon-1"> $14.000 </strong>
              </div>

              <div>
                <span>A domicilio</span>

                <strong class="price-delivery-1"> $15.000 </strong>
              </div>
            </div>
          </div>

          <!-- MENÚ 2 -->

          <div class="menu-two">
            <div class="menu-heading">MENÚ #2</div>

            <div class="items menu2-preview"></div>

            <div class="prices">
              <div>
                <span>En el salón</span>

                <strong class="price-salon-2"> $22.000 </strong>
              </div>

              <div>
                <span>A domicilio</span>

                <strong class="price-delivery-2"> $23.000 </strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
